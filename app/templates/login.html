<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MunchySSST - Acceso al Sistema</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- SweetAlert2 para Notificaciones Profesionales -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            border: none; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 420px; 
            background: #ffffff; 
        }
        .login-header { 
            border-bottom: 3px solid #d9251d; 
            text-align: center; 
            padding: 25px; 
        }
        .login-logo { 
            height: 50px; 
            width: auto; 
        }
    </style>
</head>
<body>

    <div class="card login-card p-4">
        <div class="login-header mb-3">
            <img src="/static/img/logo_header.png" alt="Munchy Logo" class="login-logo mb-2">
            <h5 class="fw-bold text-danger mb-0">Sistema SSST</h5>
            <small class="text-muted">Salud y Seguridad en el Trabajo</small>
        </div>

        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <form id="loginForm" onsubmit="event.preventDefault(); procesarLogin();">
            <h6 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-right-to-bracket me-2"></i>Inicio de Sesión</h6>
            <div class="mb-3">
                <label class="form-label fw-semibold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" id="login_username" class="form-control" required placeholder="Ingrese su usuario">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" id="login_password" class="form-control" required placeholder="Ingrese su contraseña">
                </div>
            </div>
            <button type="submit" class="btn btn-danger w-100 fw-bold py-2 mb-3">
                <i class="fa-solid fa-sign-in-alt me-1"></i> Ingresar al Sistema
            </button>
            <div class="d-flex justify-content-between">
                <a href="#" class="small text-decoration-none text-danger fw-bold" onclick="mostrarModalRegistro()"><i class="fa-solid fa-user-plus me-1"></i>Solicitar Registro</a>
                <a href="#" class="small text-warning text-decoration-none fw-bold" onclick="mostrarModalRecuperar()"><i class="fa-solid fa-key me-1"></i>Recuperar Credenciales</a>
            </div>
        </form>
    </div>

    <!-- MODAL REGISTRO DE USUARIO -->
    <div class="modal fade" id="modalRegistroUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-user-plus me-2"></i>Registro de Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formRegistroUsuario" onsubmit="event.preventDefault(); registrarNuevoUsuario();">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre de Usuario *</label>
                            <input type="text" id="reg_username" class="form-control" required placeholder="Ej. jgonzalez">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Contraseña de Acceso *</label>
                            <input type="password" id="reg_password" class="form-control" required placeholder="Asigne una contraseña segura">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Pregunta de Seguridad *</label>
                            <select id="reg_security_question" class="form-select" required>
                                <option value="¿Nombre de tu primera mascota?">¿Nombre de tu primera mascota?</option>
                                <option value="¿Ciudad donde te graduaste de secundaria?">¿Ciudad donde te graduaste de secundaria?</option>
                                <option value="¿Color favorito de la infancia?">¿Color favorito de la infancia?</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Respuesta de Seguridad *</label>
                            <input type="text" id="reg_security_answer" class="form-control" required placeholder="Respuesta confidencial de validación">
                        </div>
                        <button type="submit" class="btn btn-danger w-100 fw-bold">Completar Registro</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL RECUPERAR CONTRASEÑA CON PREGUNTA DINÁMICA -->
    <div class="modal fade" id="modalRecuperarPassword" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-warning text-dark">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-key me-2"></i>Recuperación de Credenciales</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formRecuperar" onsubmit="event.preventDefault(); procesarRecuperacion();">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre de Usuario Registrado *</label>
                            <div class="input-group">
                                <input type="text" id="rec_username" class="form-control" required placeholder="Ingrese su usuario" onchange="buscarPreguntaSeguridad()">
                                <button type="button" class="btn btn-outline-secondary" onclick="buscarPreguntaSeguridad()"><i class="fa-solid fa-magnifying-glass"></i> Ver Pregunta</button>
                            </div>
                        </div>

                        <!-- Pregunta de seguridad visualizada tras consultar el usuario -->
                        <div class="mb-3 p-3 bg-light border rounded" id="containerPreguntaSeguridad" style="display: none;">
                            <label class="form-label fw-bold text-danger mb-1"><i class="fa-solid fa-circle-question me-1"></i>Pregunta de Seguridad Asignada:</label>
                            <div id="textPreguntaSeguridad" class="fw-semibold text-dark fs-6">---</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Respuesta de Seguridad *</label>
                            <input type="text" id="rec_security_answer" class="form-control" required placeholder="Respuesta registrada en el sistema">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nueva Contraseña *</label>
                            <input type="password" id="rec_new_password" class="form-control" required placeholder="Ingrese la nueva contraseña">
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold text-dark">Actualizar Contraseña</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function mostrarModalRegistro() {
            new bootstrap.Modal(document.getElementById('modalRegistroUsuario')).show();
        }
        function mostrarModalRecuperar() {
            new bootstrap.Modal(document.getElementById('modalRecuperarPassword')).show();
        }

        async function buscarPreguntaSeguridad() {
            const username = document.getElementById('rec_username').value.trim();
            const container = document.getElementById('containerPreguntaSeguridad');
            const textPregunta = document.getElementById('textPreguntaSeguridad');

            if (!username) {
                container.style.display = 'none';
                return;
            }

            try {
                const res = await fetch(`/api/auth/get-security-question/${username}`);
                const data = await res.json();

                if (res.ok) {
                    textPregunta.textContent = data.security_question;
                    container.style.display = 'block';
                } else {
                    container.style.display = 'none';
                    Swal.fire({
                        title: 'Usuario no Encontrado',
                        text: data.detail || 'Verifique el nombre de usuario ingresado.',
                        icon: 'error',
                        confirmButtonColor: '#d9251d'
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function procesarLogin() {
            const usernameInput = document.getElementById('login_username').value.trim();
            const passwordInput = document.getElementById('login_password').value.trim();

            const formData = new FormData();
            formData.append('username', usernameInput);
            formData.append('password', passwordInput);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    Swal.fire({
                        title: 'Autenticación Exitosa',
                        text: 'Iniciando sesión en MunchySSST...',
                        icon: 'success',
                        timer: 1200,
                        showConfirmButton: false,
                        confirmButtonColor: '#d9251d'
                    }).then(() => {
                        window.location.href = '/';
                    });
                } else {
                    const data = await response.json();
                    Swal.fire({
                        title: 'Acceso Denegado',
                        text: data.detail || 'Las credenciales ingresadas son incorrectas.',
                        icon: 'error',
                        confirmButtonText: 'Entendido',
                        confirmButtonColor: '#d9251d'
                    });
                }
            } catch (e) {
                Swal.fire({
                    title: 'Error de Conexión',
                    text: 'No se pudo establecer comunicación con el servidor central.',
                    icon: 'warning',
                    confirmButtonText: 'Aceptar',
                    confirmButtonColor: '#d9251d'
                });
            }
        }

        async function registrarNuevoUsuario() {
            const formData = new FormData();
            formData.append('username', document.getElementById('reg_username').value);
            formData.append('password', document.getElementById('reg_password').value);
            formData.append('security_question', document.getElementById('reg_security_question').value);
            formData.append('security_answer', document.getElementById('reg_security_answer').value);

            try {
                const res = await fetch('/api/auth/register', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('modalRegistroUsuario')).hide();
                    document.getElementById('formRegistroUsuario').reset();
                    
                    Swal.fire({
                        title: 'Registro Completado Exitosamente',
                        text: 'La cuenta ha sido creada. Un usuario con rol de Administrador asignará sus permisos correspondientes.',
                        icon: 'success',
                        confirmButtonText: 'Iniciar Sesión',
                        confirmButtonColor: '#d9251d'
                    });
                } else {
                    Swal.fire({
                        title: 'No se pudo completar el registro',
                        text: data.detail || 'El nombre de usuario ya se encuentra registrado.',
                        icon: 'error',
                        confirmButtonText: 'Entendido',
                        confirmButtonColor: '#d9251d'
                    });
                }
            } catch (e) { 
                Swal.fire({
                    title: 'Error del Sistema',
                    text: 'Ocurrió un inconveniente al procesar la solicitud.',
                    icon: 'error',
                    confirmButtonColor: '#d9251d'
                });
            }
        }

        async function procesarRecuperacion() {
            const formData = new FormData();
            formData.append('username', document.getElementById('rec_username').value);
            formData.append('security_answer', document.getElementById('rec_security_answer').value);
            formData.append('new_password', document.getElementById('rec_new_password').value);

            try {
                const res = await fetch('/api/auth/recover', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('modalRecuperarPassword')).hide();
                    document.getElementById('formRecuperar').reset();
                    document.getElementById('containerPreguntaSeguridad').style.display = 'none';

                    Swal.fire({
                        title: 'Credenciales Actualizadas',
                        text: 'Su contraseña ha sido modificada satisfactoriamente. Puede ingresar al sistema.',
                        icon: 'success',
                        confirmButtonText: 'Aceptar',
                        confirmButtonColor: '#d9251d'
                    });
                } else {
                    Swal.fire({
                        title: 'Validación Fallida',
                        text: data.detail || 'La respuesta de seguridad es incorrecta.',
                        icon: 'error',
                        confirmButtonText: 'Reintentar',
                        confirmButtonColor: '#d9251d'
                    });
                }
            } catch (e) {
                Swal.fire({
                    title: 'Error de Comunicación',
                    text: 'No se pudo procesar la redefinición de contraseña.',
                    icon: 'error',
                    confirmButtonColor: '#d9251d'
                });
            }
        }
    </script>
</body>
</html>
